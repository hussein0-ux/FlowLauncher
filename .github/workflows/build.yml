name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "===== COMPILER ERRORS ====="
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -60 || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FlowLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FlowLauncher-apk
          path: FlowLauncher.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flow Launcher build ${{ github.run_number }}
          files: FlowLauncher.apk
